<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { width: 1200px; height: 630px; background: #0d1117; color: #e6edf3;
           font: 28px/1.4 system-ui, sans-serif; padding: 70px 80px; position: relative; overflow: hidden; }
    .brand { display: flex; align-items: center; gap: 20px; }
    .brand svg { width: 70px; height: 70px; }
    h1 { font-size: 76px; letter-spacing: -1px; }
    .tag { color: #9aa7b4; font-size: 34px; margin-top: 26px; max-width: 900px; }
    .badges { margin-top: 56px; display: flex; gap: 16px; }
    .b { border-radius: 999px; padding: 8px 22px; font-size: 24px; font-weight: 600; }
    .official { background: #2ea04326; color: #3fb950; }
    .community { background: #d2992226; color: #d29922; }
    .crowd { background: #8957e526; color: #a371f7; }
    .row { position: absolute; bottom: 70px; left: 80px; right: 80px; display: flex;
           justify-content: space-between; color: #6e7681; font-size: 26px; }
    .url { color: #58a6ff; }
  </style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#161b22"/>
      <rect x="14" y="34" width="7" height="16" rx="2" fill="#3fb950"/>
      <rect x="25" y="26" width="7" height="24" rx="2" fill="#58a6ff"/>
      <rect x="36" y="30" width="7" height="20" rx="2" fill="#d29922"/>
      <rect x="47" y="20" width="3" height="30" rx="1.5" fill="#6e7681"/>
      <path d="M14 22 L25 17 L36 21 L47 13" fill="none" stroke="#e6edf3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>LimitWatch</h1>
  </div>
  <div class="tag">Official AI subscription limits across providers, tracked over time. Every number links to its source.</div>
  <div class="badges">
    <span class="b official">official</span>
    <span class="b community">community</span>
    <span class="b crowd">crowdsourced</span>
  </div>
  <div class="row">
    <span>Claude · ChatGPT · Gemini · Grok · Perplexity</span>
    <span class="url">limitwatch.southforgeai.com</span>
  </div>
</body>
</html>
