name: Usage reading
description: Report a real usage observation from a provider usage screen. Screenshot required. A maintainer verifies before publishing.
title: "[usage] <provider> <plan> — <what you saw>"
labels: ["usage-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a reading. Record **what the usage screen actually showed**, not a guess.
        **Attach a screenshot** of the usage panel (required). For Cursor, a usage-events CSV is helpful so Free/promo rows can be excluded.
        Verified reports go into `data/usage-reports.json`; the git history is the audit trail.
        Prefer the on-site form at https://limitwatch.dev/#contribute when you can.
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Anthropic, OpenAI, Cursor, Google, GitHub Copilot, Replit, xAI, Perplexity, Other]
    validations:
      required: true
  - type: input
    id: plan
    attributes:
      label: Plan
      description: e.g. Pro, Max 5x, Plus, Go
      placeholder: Pro
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface (where you read it)
      options: [Claude Code, claude.ai, Cursor dashboard, Codex / ChatGPT, desktop app, other]
    validations:
      required: true
  - type: dropdown
    id: window
    attributes:
      label: Cap window this observes
      options: ["5h", "day", "week", "month"]
    validations:
      required: true
  - type: input
    id: captured_at
    attributes:
      label: When you read it
      description: Date and time (with timezone if you can). e.g. 2026-06-08 14:30 UTC
    validations:
      required: true
  - type: dropdown
    id: metric
    attributes:
      label: What the number means
      options: [percent, messages, tokens]
    validations:
      required: true
  - type: input
    id: observed
    attributes:
      label: Observed value
      description: The number at capture — percent used, messages sent, or tokens.
      placeholder: "72"
    validations:
      required: true
  - type: dropdown
    id: limit_hit
    attributes:
      label: Did the cap actually throttle at this reading?
      options: ["no", "yes — hit the cap"]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model in use (optional)
      placeholder: Claude Opus 4.8
  - type: textarea
    id: note
    attributes:
      label: Note
      description: Verbatim wording from the usage screen plus any context (session length, Free vs Included, etc.).
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach a screenshot to this issue (drag onto the comment box), then paste the image markdown link here. Optional CSV filename if you also attach a Cursor usage export.
      placeholder: "![usage](…uploaded screenshot…)"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This is a real reading I observed, recorded as shown, and the screenshot matches it (no guessed numbers).
          required: true
