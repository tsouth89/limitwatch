name: Usage reading
description: Report a real usage observation from a provider usage screen. Screenshot required. A maintainer verifies before publishing.
title: "[usage] <provider> <plan> — <what you saw>"
labels: ["usage-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a reading. Record **what the usage screen actually showed**, not a guess.
        **Attach a screenshot** of the usage panel (required). For Cursor/Replit, a usage-events CSV helps exclude Free/promo rows.
        Verified reports go into `data/usage-reports.json`; the git history is the audit trail.
        Prefer the on-site form at https://limitwatch.dev/#contribute when you can.
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Cursor, Anthropic, OpenAI, GitHub Copilot, Replit, Google, xAI, Perplexity, Other]
    validations:
      required: true
  - type: input
    id: plan
    attributes:
      label: Plan
      description: e.g. Pro, Plus, Max 5x, Ultra, Go
      placeholder: Pro
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where you read it
      options:
        - Coding agent (IDE / CLI)
        - Web usage panel
        - Desktop app
        - Billing / usage dashboard
        - Usage CSV export
        - Other
    validations:
      required: true
  - type: dropdown
    id: window
    attributes:
      label: Limit window
      options: ["5h", "day", "week", "month"]
    validations:
      required: true
  - type: input
    id: captured_at
    attributes:
      label: When you read it
      description: Date and time (with timezone if you can). e.g. 2026-06-08 14:30 UTC
    validations:
      required: true
  - type: dropdown
    id: metric
    attributes:
      label: What the number is
      options: [percent, tokens, messages]
    validations:
      required: true
  - type: input
    id: observed
    attributes:
      label: Observed value
      description: The number at capture — percent used, tokens, or messages/requests.
      placeholder: "34"
    validations:
      required: true
  - type: dropdown
    id: limit_hit
    attributes:
      label: Did you hit the limit / get throttled at this reading?
      options: ["no", "yes — hit the limit"]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model in use (optional)
      placeholder: e.g. Opus, GPT-5.5, Auto
  - type: textarea
    id: note
    attributes:
      label: Exact wording on screen + brief context
      description: Quote the usage panel. Mention Free vs Included if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach a screenshot to this issue, then paste the image markdown link here. Optional CSV filename if you also attach a usage export.
      placeholder: "![usage](…uploaded screenshot…)"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: Real reading I observed — screenshot matches the numbers (no guessed values).
          required: true
