name: news-discovery

# Polls provider news/changelog feeds (data/feeds.json) for NEW announcements and maintains one
# rolling triage issue only when something needs human attention. If the ANTHROPIC_API_KEY secret
# is set, classifier-confirmed irrelevant items stay quiet; relevant items can draft event stubs.
# It proposes only; a human reviews the issue and edits data/events.json. Complements
# weekly-source-watch (which diffs known pricing pages rather than discovering new posts).

on:
  workflow_dispatch: {}
  schedule:
    # Daily 12:23 UTC (off the hour to dodge scheduler congestion).
    - cron: "23 12 * * *"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resume checked discovery update
        run: bash .github/scripts/push-checked-update.sh prepare automation/news-discovery

      - name: Discover new provider news
        env:
          # Optional: add the repo secret to enable relevance filtering + event drafting.
          # Without it the job still lists new items for manual triage.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/discover.mjs

      - name: Add actionable discovery to the triage queue
        if: hashFiles('data/_discover-summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '<!-- limitwatch: relevant=0 -->' data/_discover-summary.md; then
            echo "Classifier found no consumer-plan limit or pricing news. No issue needed."
            exit 0
          fi
          queue="$(gh issue list --label discovery --state open --limit 100 --json number,title --jq '.[] | select(.title == "News discovery triage queue") | .number' | head -n1)"
          if [ -n "$queue" ]; then
            gh issue comment "$queue" --body-file data/_discover-summary.md
          else
            gh issue create --title "News discovery triage queue" --body-file data/_discover-summary.md --label "discovery"
          fi

      - name: Commit advanced discovery state + radar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f data/_discover-summary.md
          bash .github/scripts/push-checked-update.sh publish \
            automation/news-discovery \
            "data: discovery state + news radar + auto-events" \
            data/discover-state.json data/news.json data/auto-events.json
