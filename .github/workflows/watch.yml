name: weekly-source-watch

# Checks all monitored pages for changes and maintains one rolling triage issue if anything moved.
# HTTP sources run via plain fetch. Cloudflare-protected pages (e.g. OpenAI) run
# via headed patchright + Xvfb — Chrome gets a real X11 display and passes CF bot
# detection the same way a local desktop session does (headless = 403).

on:
  workflow_dispatch: {}
  schedule:
    # Mondays 13:17 UTC (off the top of the hour to avoid GitHub's scheduler congestion).
    - cron: "17 13 * * 1"

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm ci

      - name: Install Chrome + Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 1

      - name: Run source watch (all sources)
        env:
          DISPLAY: ":99"
          # Optional residential proxy for Cloudflare-hard pages (e.g. openai.com/chatgpt/pricing/).
          # First attempt goes direct (free); retries route through this proxy.
          # Set repo secret BROWSER_PROXY=http://user:pass@host:port to enable.
          BROWSER_PROXY: ${{ secrets.BROWSER_PROXY }}
        run: node scripts/fetch.mjs --ci

      - name: Add changed sources to the triage queue
        if: hashFiles('data/_watch-summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          queue="$(gh issue list --label source-watch --state open --limit 100 --json number,title --jq '.[] | select(.title == "Source watch triage queue") | .number' | head -n1)"
          if [ -n "$queue" ]; then
            gh issue comment "$queue" --body-file data/_watch-summary.md
          else
            gh issue create --title "Source watch triage queue" --body-file data/_watch-summary.md --label "source-watch"
          fi

      - name: Commit advanced baseline
        run: |
          rm -f data/_watch-summary.md
          if ! git diff --quiet -- data/source-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/source-state.json
            git commit -m "chore: advance source-watch baseline [skip ci]"
            git push
          else
            echo "No baseline change to commit."
          fi
